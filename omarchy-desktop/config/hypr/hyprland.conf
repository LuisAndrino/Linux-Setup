# ==============================================================================
# hyprland.conf - Configuración del entorno gráfico estilo Omarchy
# ==============================================================================
# Inspirado en Omarchy: Teclado prioritario, animaciones suaves, temas dinámicos
# y compatibilidad garantizada para NetBeans, MySQL Workbench y Steam.
# ==============================================================================

# 1. Monitores (Resolución automática fluida)
monitor=,preferred,auto,1

# 2. Variables de entorno globales & Compatibilidad X11/Java
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = _JAVA_AWT_WM_NONREPARENTING,1       # FIX CRÍTICO: Previene pantallas grises en Apache NetBeans
env = GDK_BACKEND,wayland,x11             # Soporte híbrido para MySQL Workbench
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# 3. Incluir colores del tema dinámico activo (omarchy-theme)
source = ~/.config/hypr/theme.conf

# 4. Programas por defecto
$terminal = alacritty
$fileManager = thunar
$menu = rofi -show drun
$agent = agent

# 5. Inicio automático de servicios
exec-once = waybar &
exec-once = swaync &
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-kde-authentication-agent-1 &

# 6. Aspecto visual (Look & Feel estilo Omarchy)
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = $col_active_border
    col.inactive_border = $col_inactive_border

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(10, 10, 15, 0.45)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }
}

# 7. Animaciones elásticas y fluidas
animations {
    enabled = true

    bezier = omarchyBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeOutQuint, 0.23, 1, 0.32, 1

    animation = windows, 1, 4, omarchyBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, easeOutQuint, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

xwayland {
    force_zero_scaling = true
}

# 8. Atajos de teclado (Keybindings estilo Omarchy)
$mainMod = SUPER

# Lanzadores esenciales
bind = $mainMod, SPACE, exec, $menu                   # Menú de apps estilo Omarchy
bind = $mainMod, RETURN, exec, $terminal             # Terminal rápida (Alacritty)
bind = $mainMod, C, exec, $agent                     # MODO AGENTE IA (Antigravity / Claude Code)
bind = $mainMod, T, exec, omarchy-theme next         # Cambiar tema en tiempo real
bind = $mainMod, B, exec, brave-origin || brave      # Navegador
bind = $mainMod, E, exec, $fileManager               # Explorador de archivos
bind = $mainMod, Q, killactive                       # Cerrar ventana
bind = $mainMod, F, fullscreen, 1                    # Pantalla completa
bind = $mainMod, V, togglefloating                   # Ventana flotante

# Navegación entre ventanas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Espacios de trabajo (Workspaces 1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Teclas multimedia y brillo
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Mover/redimensionar ventanas con ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# 9. REGLAS DE VENTANAS Y COMPATIBILIDAD (X11, NetBeans, MySQL Workbench)
windowrulev2 = suppressevent maximize, class:.*

# Reglas especiales para Apache NetBeans (Java Swing)
windowrulev2 = float,class:^(org.apache.netbeans)$
windowrulev2 = noinitialfocus,class:^(org.apache.netbeans)$,title:^(win.*)$

# Reglas especiales para MySQL Workbench
windowrulev2 = float,class:^(MySQLWorkbench)$
windowrulev2 = tile,class:^(MySQLWorkbench)$,title:^(MySQL Workbench)$

# Reglas para Steam y Gaming
windowrulev2 = float,class:^(steam)$,title:^(Friends List)$
windowrulev2 = float,class:^(steam)$,title:^(Steam - News)$
windowrulev2 = float,class:^(com.github.wwmm.easyeffects)$
windowrulev2 = float,class:^(org.localsend.localsend_app)$
windowrulev2 = float,class:^(io.github.peazip.PeaZip)$
windowrulev2 = float,class:^(com.usebottles.bottles)$
windowrulev2 = float,class:^(pavucontrol)$
