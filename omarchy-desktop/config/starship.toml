# Starship Prompt - Estilo Omarchy
add_newline = false

format = """
[╭─ ](bold cyan)$directory$git_branch$git_status$character
[╰─❯ ](bold cyan)"""

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'

[character]
success_symbol = "[λ](bold green)"
error_symbol = "[✗](bold red)"
