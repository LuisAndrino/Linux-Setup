# ==============================================================================
# Alacritty configuration - Estilo Omarchy
# ==============================================================================

import = [
    "~/.config/alacritty/theme.toml"
]

[window]
padding = { x = 12, y = 12 }
opacity = 0.95
blur = true
decorations = "none"

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[cursor]
style = { shape = "Beam", blinking = "On" }
