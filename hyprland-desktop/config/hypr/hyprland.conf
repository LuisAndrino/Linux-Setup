# ==============================================================================
# hyprland.conf - Configuración ligera estilo Omarchy (Compatible con Hyprland 0.56+)
# ==============================================================================

# -----------------------------------------------------------------------------
# 1. Monitores
# -----------------------------------------------------------------------------
monitor = , preferred, auto, auto

# -----------------------------------------------------------------------------
# 2. Entorno y Variables de Compatibilidad (Java, X11, Wayland)
# -----------------------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Soporte de cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Forzar compatibilidad con aplicaciones Java (NetBeans, etc.) y XWayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# -----------------------------------------------------------------------------
# 3. Autostart - Servicios esenciales ligeros
# -----------------------------------------------------------------------------
# Agente de autenticación gráfica polkit (esencial para prompts de contraseña)
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1

# Barra de tareas en cápsulas (Waybar)
exec-once = waybar

# Notificaciones ligeras (SwayNC o Mako)
exec-once = swaync || mako

# Fondo de pantalla
exec-once = swaybg -m fill -c 1a1b26

# Historial de portapapeles
exec-once = wl-paste --watch cliphist store 2>/dev/null || true

# -----------------------------------------------------------------------------
# 4. Tema y Colores Dinámicos
# -----------------------------------------------------------------------------
# Importar tema activo gestionado por 'hypr-theme'
source = ~/.config/hypr/theme.conf

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = smooth, 0.25, 1, 0.5, 1

    animation = windows, 1, 4, easeOutQuint
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 4, easeOutQuint
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

input {
    kb_layout = us,es
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}


# -----------------------------------------------------------------------------
# 5. Atajos de Teclado (Shortcuts estilo Omarchy)
# -----------------------------------------------------------------------------
$mainMod = SUPER

# Menú de búsqueda estilo Omarchy con Super + Space
bind = $mainMod, Space, exec, rofi -show drun

# Terminal rápida acelerada por GPU
bind = $mainMod, Return, exec, alacritty

# Modo Agente de IA (Antigravity / Claude Code)
bind = $mainMod, C, exec, alacritty -e ~/.local/bin/agent
bind = $mainMod SHIFT, C, exec, alacritty -e ~/.local/bin/c

# Conmutador dinámico de temas
bind = $mainMod, T, exec, ~/.local/bin/hypr-theme next

# Control de ventanas
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar || dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Capturas de pantalla
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Mover foco con flechas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Mover foco estilo Vim
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u

# Espacios de trabajo 1-9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Mover ventana activa a espacio de trabajo
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mover y redimensionar con mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Teclas multimedia y brillo
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# -----------------------------------------------------------------------------
# 6. Reglas de Ventanas (Sintaxis universal limpia)
# -----------------------------------------------------------------------------
windowrule = match:class pavucontrol, float 1
windowrule = match:class nm-connection-editor, float 1
windowrule = match:class blueman-manager, float 1
windowrule = match:class org.kde.polkit-kde-authentication-agent-1, float 1

# Solución para Apache NetBeans (evitar cuelgues o ventanas grises)
windowrule = match:class Apache NetBeans.*, tile 1
windowrule = match:class .*netbeans.*, tile 1

# Solución para MySQL Workbench
windowrule = match:class mysql-workbench-bin, float 0
windowrule = match:class MySQL Workbench, float 0

# Reglas de capas para efectos translúcidos en la barra
layerrule = match:namespace waybar, blur 1
layerrule = match:namespace rofi, blur 1
